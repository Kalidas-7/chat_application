name: Flutter Build + MobSF Scan (Debug)

on:
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repository
    - name: Checkout repo
      uses: actions/checkout@v4

    # 🔍 DEBUG: show current directory
    - name: Debug - pwd
      run: pwd

    # 🔍 DEBUG: list root files
    - name: Debug - ls
      run: ls -la

    # 🔍 DEBUG: recursive listing (important)
    - name: Debug - ls -R
      run: ls -R

    # 2️⃣ Set up Java
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # 3️⃣ Set up Flutter
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: stable

    # 🔍 DEBUG: confirm flutter is available
    - name: Debug - flutter doctor
      run: flutter doctor -v

    # 4️⃣ Flutter pub get (NO cd)
    - name: Flutter pub get
      run: flutter pub get

    # 5️⃣ Build release APK
    - name: Build APK
      run: flutter build apk --release

    # 🔍 DEBUG: verify APK output
    - name: Debug - APK output
      run: |
        ls -la build/app/outputs/flutter-apk || true
        find . -name "*.apk"

    # 6️⃣ Upload APK artifact
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: flutter-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    # 7️⃣ Start MobSF
    - name: Start MobSF
      run: |
        docker pull opensecurity/mobile-security-framework-mobsf
        docker run -d -p 8000:8000 --name mobsf \
          opensecurity/mobile-security-framework-mobsf

    # 8️⃣ Wait for MobSF
    - name: Wait for MobSF
      run: |
        until curl -s http://localhost:8000/api/v1/healthcheck/; do
          echo "Waiting for MobSF..."
          sleep 10
        done

    # 9️⃣ Upload APK to MobSF
    - name: Upload APK to MobSF
      run: |
        curl -X POST http://localhost:8000/api/v1/upload \
          -H "Authorization:${{ secrets.MOBSF_API_KEY }}" \
          -F "file=@build/app/outputs/flutter-apk/app-release.apk" \
          > upload.json

    # 🔟 Extract scan hash
    - name: Extract scan hash
      run: |
        cat upload.json
        echo "SCAN_HASH=$(jq -r .hash upload.json)" >> $GITHUB_ENV

    # 1️⃣1️⃣ Run MobSF scan
    - name: Run MobSF scan
      run: |
        curl -X POST http://localhost:8000/api/v1/scan \
          -H "Authorization:${{ secrets.MOBSF_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{\"hash\":\"${SCAN_HASH}\"}"

    # 1️⃣2️⃣ Download JSON report
    - name: Download JSON report
      run: |
        curl -X POST http://localhost:8000/api/v1/report_json \
          -H "Authorization:${{ secrets.MOBSF_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{\"hash\":\"${SCAN_HASH}\"}" \
          -o mobsf-report.json

    # 1️⃣3️⃣ Download PDF report
    - name: Download PDF report
      run: |
        curl -X POST http://localhost:8000/api/v1/download_pdf \
          -H "Authorization:${{ secrets.MOBSF_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{\"hash\":\"${SCAN_HASH}\"}" \
          -o mobsf-report.pdf

    # 1️⃣4️⃣ Upload MobSF findings
    - name: Upload MobSF reports
      uses: actions/upload-artifact@v4
      with:
        name: mobsf-findings
        path: |
          mobsf-report.json
          mobsf-report.pdf

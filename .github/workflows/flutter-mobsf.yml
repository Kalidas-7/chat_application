name: Flutter Build + MobSF Scan (Manual)

on:
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v4

    # 🔍 DEBUG: show where we are
    - name: Debug - pwd
      run: pwd

    - name: Debug - ls
      run: ls -la

    # 2️⃣ Set up Java
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # 3️⃣ Set up Flutter
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: stable

    # 4️⃣ Flutter pub get
    - name: Flutter pub get
      run: flutter pub get

    # 5️⃣ Build release APK
    - name: Build APK
      run: flutter build apk --release

    # 🔍 DEBUG: confirm APK exists
    - name: Debug - APK output
      run: |
        find . -name "*.apk"
        ls -la build/app/outputs/flutter-apk

    # 6️⃣ Upload APK artifact
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: flutter-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    # 7️⃣ Start MobSF Docker
    - name: Start MobSF
      run: |
        docker pull opensecurity/mobile-security-framework-mobsf
        docker run -d -p 8000:8000 --name mobsf \
          opensecurity/mobile-security-framework-mobsf

    # 8️⃣ Wait for MobSF to be ready
    - name: Wait for MobSF
      run: |
        until curl -s http://localhost:8000/api/v1/healthcheck/; do
          echo "Waiting for MobSF..."
          sleep 10
        done

    # 9️⃣ Upload APK to MobSF
    - name: Upload APK to MobSF
      run: |
        curl -X POST http://localhost:8000/api/v1/upload \
          -H "Authorization: ${{ secrets.MOBSF_API_KEY }}" \
          -F "file=@build/app/outputs/flutter-apk/app-release.apk" \
          -o upload.json

        echo "Upload response:"
        cat upload.json

    # 🔟 Extract scan hash (fail if missing)
    - name: Extract scan hash
      run: |
        HASH=$(jq -r '.hash // empty' upload.json)
        if [ -z "$HASH" ]; then
          echo "❌ MobSF upload failed"
          exit 1
        fi
        echo "SCAN_HASH=$HASH" >> $GITHUB_ENV

    # 1️⃣1️⃣ Run MobSF scan
    - name: Run MobSF scan
      run: |
        curl -X POST http://localhost:8000/api/v1/scan \
          -H "Authorization: ${{ secrets.MOBSF_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{\"hash\":\"${SCAN_HASH}\"}"

    # 1️⃣2️⃣ Download JSON report
    - name: Download MobSF JSON report
      run: |
        curl -X POST http://localhost:8000/api/v1/report_json \
          -H "Authorization: ${{ secrets.MOBSF_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{\"hash\":\"${SCAN_HASH}\"}" \
          -o mobsf-report.json

        echo "MobSF report:"
        cat mobsf-report.json

    # 1️⃣3️⃣ Upload MobSF findings
    - name: Upload MobSF findings
      uses: actions/upload-artifact@v4
      with:
        name: mobsf-findings
        path: mobsf-report.json

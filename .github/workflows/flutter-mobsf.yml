name: Flutter Build + MobSFScan (Artifacts Only)

on:
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Java
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # 3️⃣ Flutter
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: stable

    # 4️⃣ Dependencies
    - name: Flutter pub get
      run: flutter pub get

    # 5️⃣ Build APK
    - name: Build APK
      run: flutter build apk --release

    # 6️⃣ Upload APK artifact
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: flutter-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    # 7️⃣ Run MobSFScan (CORRECT)
    - name: MobSFScan APK
      uses: MobSF/mobsfscan@main
      with:
        args: >
          scan
          --apk build/app/outputs/flutter-apk/app-release.apk
          --json mobsfscan-report.json
          --sarif mobsfscan-report.sarif

    # 8️⃣ Verify reports
    - name: Verify MobSFScan output
      run: |
        ls -la
        ls -la *.json *.sarif || true

    # 9️⃣ Upload MobSFScan reports
    - name: Upload MobSFScan reports
      uses: actions/upload-artifact@v4
      with:
        name: mobsfscan-results
        path: |
          mobsfscan-report.json
          mobsfscan-report.sarif

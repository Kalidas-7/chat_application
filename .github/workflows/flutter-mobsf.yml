name: Flutter Build + MobSF Scan (Manual)

on:
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout source code
    - name: Checkout repo
      uses: actions/checkout@v4

    # 2️⃣ Set up Java (required for Android)
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3️⃣ Set up Flutter
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: 'stable'

    # 4️⃣ Install dependencies
    - name: Flutter pub get
      working-directory: chat_application
      run: flutter pub get

    # 5️⃣ Build release APK
    - name: Build APK
      working-directory: chat_application
      run: flutter build apk --release

    # 6️⃣ Upload APK as artifact
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: flutter-apk
        path: chat_application/build/app/outputs/flutter-apk/app-release.apk

    # 7️⃣ Start MobSF Docker
    - name: Start MobSF
      run: |
        docker pull opensecurity/mobile-security-framework-mobsf
        docker run -d -p 8000:8000 --name mobsf \
          opensecurity/mobile-security-framework-mobsf

    # 8️⃣ Wait for MobSF to be ready
    - name: Wait for MobSF
      run: |
        until curl -s http://localhost:8000/api/v1/healthcheck/; do
          echo "Waiting for MobSF..."
          sleep 10
        done

    # 9️⃣ Upload APK to MobSF
    - name: Upload APK to MobSF
      run: |
        curl -X POST http://localhost:8000/api/v1/upload \
          -H "Authorization:${{ secrets.MOBSF_API_KEY }}" \
          -F "file=@chat_application/build/app/outputs/flutter-apk/app-release.apk" \
          > upload.json

    # 🔟 Extract scan hash
    - name: Extract scan hash
      run: |
        echo "SCAN_HASH=$(jq -r .hash upload.json)" >> $GITHUB_ENV

    # 1️⃣1️⃣ Run MobSF scan
    - name: Run MobSF scan
      run: |
        curl -X POST http://localhost:8000/api/v1/scan \
          -H "Authorization:${{ secrets.MOBSF_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{\"hash\":\"${SCAN_HASH}\"}"

    # 1️⃣2️⃣ Download JSON report
    - name: Download JSON report
      run: |
        curl -X POST http://localhost:8000/api/v1/report_json \
          -H "Authorization:${{ secrets.MOBSF_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{\"hash\":\"${SCAN_HASH}\"}" \
          -o mobsf-report.json

    # 1️⃣3️⃣ Download PDF report
    - name: Download PDF report
      run: |
        curl -X POST http://localhost:8000/api/v1/download_pdf \
          -H "Authorization:${{ secrets.MOBSF_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{\"hash\":\"${SCAN_HASH}\"}" \
          -o mobsf-report.pdf

    # 1️⃣4️⃣ Upload MobSF findings
    - name: Upload MobSF reports
      uses: actions/upload-artifact@v4
      with:
        name: mobsf-findings
        path: |
          mobsf-report.json
          mobsf-report.pdf

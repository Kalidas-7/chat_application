name: Flutter Build + MobSFScan (Artifacts Only)

on:
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout source
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Set up Java (Android build requirement)
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # 3️⃣ Set up Flutter
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: stable

    # 4️⃣ Install dependencies
    - name: Flutter pub get
      run: flutter pub get

    # 5️⃣ Build release APK
    - name: Build APK
      run: flutter build apk --release

    # 6️⃣ Verify APK
    - name: Verify APK output
      run: |
        ls -la build/app/outputs/flutter-apk
        find . -name "*.apk"

    # 7️⃣ Upload APK as artifact
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: flutter-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    # 8️⃣ Run MobSFScan on APK (NO FAIL)
    - name: MobSFScan APK
      uses: MobSF/mobsfscan@v2
      with:
        scan_type: apk
        target: build/app/outputs/flutter-apk/app-release.apk
        output: mobsfscan-report.json
        sarif: mobsfscan-report.sarif
        severity: INFO   # does NOT fail build

    # 9️⃣ Upload MobSFScan reports
    - name: Upload MobSFScan reports
      uses: actions/upload-artifact@v4
      with:
        name: mobsfscan-results
        path: |
          mobsfscan-report.json
          mobsfscan-report.sarif
